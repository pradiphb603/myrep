[project]
name = "mcp-server-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.8",
    "ipykernel>=7.4.0",
    "klayout>=0.30.13",
    "langchain>=1.5.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.5",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
mcp-server-demo = "mcp_server_demo:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
